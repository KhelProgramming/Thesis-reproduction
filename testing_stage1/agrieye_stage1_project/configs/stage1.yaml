# Training values transcribed from AgriEye Appendix K, printed pp. 159-160.
# 50 epochs is the displayed example, not a confirmed historical V8 stage schedule.
epochs: 50
imgsz: 640
batch: 16
optimizer: AdamW
lr0: 0.0001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
patience: 20
cos_lr: true
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.4
flipud: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
exist_ok: false
save_period: 10
plots: true
verbose: true
device: 0
amp: true

